name: Deploy Supabase

# Applies new migrations and deploys Edge Functions to the hosted project.
# Requires repo variable SUPABASE_PROJECT_ID and secrets SUPABASE_ACCESS_TOKEN
# and SUPABASE_DB_PASSWORD. Skipped until the variable is set.

on:
  push:
    branches: [main]
    paths: ['supabase/**']
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.SUPABASE_PROJECT_ID != ''
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - run: supabase db push
      - name: Deploy Edge Functions
        run: |
          if compgen -G "supabase/functions/*/index.ts" > /dev/null; then
            supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"
          else
            echo "No Edge Functions to deploy."
          fi
